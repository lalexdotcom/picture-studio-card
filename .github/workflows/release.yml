name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  # read: download the bundle from CI's run. write: delete it once it is no
  # longer needed — see the purge step at the end of the job.
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # `event == 'push'` is load-bearing and was not needed before `next` existed.
    # For a CI run triggered by a pull request, `head_branch` is the *source*
    # branch — so a PR from `next` onto `main` would satisfy the branch test,
    # start this job, pass every guard, and then hard-fail on the artefact
    # download, since CI only uploads the bundle for pushes. Previously
    # impossible: no PR has `main` as its source.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'next')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, because the reconciliation step below asks whether
          # `next` is an ancestor of this commit, and a shallow clone cannot
          # answer that. The repository is small; a release is rare.
          fetch-depth: 0

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION has no tag — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The pre-release equivalent of the `unreleased` catch below, and it exists
      # for the same reason: a property of the pipeline rather than a habit
      # anyone has to remember. Forgetting the `-beta.N` suffix while publishing
      # from `next` would otherwise send a feature build to every user of the
      # card as a stable release, which is the one mistake here that cannot be
      # taken back.
      #
      # It runs *after* the gate deliberately. `next` is recreated from `main`
      # after every minor, so it spends a moment carrying the stable version that
      # was just published — already tagged, hence a no-op, and a no-op must stay
      # green. Only a version this job would actually publish is checked.
      - name: The branch and the version must agree
        if: steps.gate.outputs.release == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          case "$VERSION" in
            *-*) suffixed=true ;;
            *)   suffixed=false ;;
          esac

          if [ "$BRANCH" = main ] && [ "$suffixed" = true ]; then
            echo "::error::$VERSION is a pre-release version and main publishes stable releases only"
            exit 1
          fi

          if [ "$BRANCH" = next ] && [ "$suffixed" = false ]; then
            echo "::error::$VERSION carries no pre-release suffix and next publishes pre-releases only"
            exit 1
          fi

          echo "$BRANCH publishing $VERSION."

      # What the changelog's inverted catch used to infer from a heading's date,
      # asked directly of the tags. A pre-release of a version that is already
      # out can only come from a `next` that was never recreated from `main`
      # after its line shipped — publishing betas of a version users already
      # have. The check is skipped for a stable, which is what `contains` does
      # here.
      - name: A pre-release of a version already out is a stale next
        if: >
          steps.gate.outputs.release == 'true' &&
          contains(steps.version.outputs.version, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          base="${VERSION%%-*}"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$base" >/dev/null 2>&1; then
            echo "::error::v$base is already released, so $VERSION can only come from a next that was never recreated"
            exit 1
          fi

          echo "v$base is not out; $VERSION is a pre-release of it."

      # The last hole in the two-branch chain, and the only one that stays
      # silent. `next` holds `1.6.0-beta.3`; someone opens `1.6.0` on `main`
      # believing they are taking the next minor; `main` then publishes a stable
      # `1.6.0` containing none of the features the testers were testing, under
      # exactly the number they were waiting for. The inverted changelog catch
      # will stop `next` publishing afterwards — correctly, and far too late.
      #
      # The invariant that closes it: a stable may ship a version `next` still
      # claims only once `next` has actually been merged into it.
      - name: A version next still claims must ship with next in it
        if: >
          steps.gate.outputs.release == 'true' &&
          github.event.workflow_run.head_branch == 'main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin next >/dev/null 2>&1; then
            echo "No next branch — nothing to reconcile."
            exit 0
          fi

          git fetch --no-tags --quiet origin next
          next_version=$(git show FETCH_HEAD:package.json | jq -r .version)
          next_base="${next_version%%-*}"

          if [ "$next_base" != "$VERSION" ]; then
            echo "next holds $next_version, a different line from $VERSION."
            exit 0
          fi

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "next ($next_version) is contained in this commit."
            exit 0
          fi

          echo "::error::next holds $next_version and has not been merged, so $VERSION cannot ship without it"
          exit 1

      - name: Extract the changelog section
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Every published artefact has its own section, so this is an exact
        # match and there is no base-version indirection left. The script
        # refuses an absent section, an empty one, and one still marked
        # `unreleased` — the catch that keeps an in-progress version from being
        # shipped by an accidental push. It lives in scripts/ so `pnpm test`
        # exercises it; see scripts/release-notes.sh.
        run: scripts/release-notes.sh "$VERSION" > release-notes.md

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.release == 'true'
        with:
          name: bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      # Pinned to a commit, not to `v2`: this job holds `contents: write`, and
      # HACS installs from the asset it publishes. A moved tag would run
      # someone else's code with enough scope to publish a release to every
      # user of the card. Bump the SHA and the comment together.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.gate.outputs.release == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: v${{ steps.version.outputs.version }}
          # The SemVer suffix decides, so nobody has to: `1.6.0-beta.3` carries a
          # `-`, `1.6.0` does not. GitHub refuses to point `latest` at a
          # pre-release, and `latest` is what HACS follows for everyone who has
          # not turned on "Show beta versions" — so this single field is the
          # whole of what separates the two audiences.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body_path: release-notes.md
          generate_release_notes: true
          files: picture-studio.js

      # Runs on success only, which covers both useful cases: the no-op, where
      # the bundle was never used, and the release, where the file is now
      # attached permanently. On failure it does NOT run — a failed job's
      # bundle is what re-running it needs, and deleting that would destroy the
      # recovery the retention exists for.
      - name: Purge the bundle artefact
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Housekeeping must never redden a job whose release succeeded, so
          # this step reports through ::warning:: and always exits 0. The
          # default shell runs with -e; turn it off deliberately.
          set +e
          set -u -o pipefail

          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name == "bundle") | .id' | head -1)

          if [ -z "$id" ]; then
            echo "::warning::No bundle artefact on run $RUN_ID; nothing to purge."
            exit 0
          fi

          if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null; then
            echo "Purged bundle artefact $id from run $RUN_ID."
          else
            echo "::warning::Could not delete bundle artefact $id from run $RUN_ID; it will expire on its own."
          fi
          exit 0
